{% set name = "asv" %}
{% set version = "0.6.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: a8eeb7c5037cd78c146bd727d27203132438d4d62f36e669eb0cd5d63da0cf39

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - asv = asv.main:main
  skip: true  # [py<37]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - python
    - pip
    - setuptools >=64,<72.2.0
    - setuptools-scm >=6
  run:
    - python
    - six >=1.4
    - asv_runner >=v0.2.1
    - json5
    - python-build
    - tabulate
    - virtualenv
    - packaging
    - importlib-metadata
    - tomli  # [py<311]
    - colorama  # [win]
    - pyyaml
    - pympler

test:
  imports:
    - asv
    - asv.commands
    - asv.plugins
    - asv.extern
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/airspeed-velocity/asv
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.rst
  summary: A simple Python benchmarking tool with web-based reporting
  description: |
    It is primarily designed to benchmark a single project over its lifetime
    using a given suite of benchmarks. The results are displayed in an
    interactive web frontend that requires only a basic static webserver to
    host.
  doc_url: https://asv.readthedocs.io/en/latest/index.html
  dev_url: https://github.com/airspeed-velocity/asv

extra:
  recipe-maintainers:
    - CJ-Wright
    - saraedum
    - xhochy
    - mlondschien
    - mattip
    - jbrockmendel
    - datapythonista
